tags:
- name: '#Action=DeauthorizeDataShare'
paths:
  /#Action=DeauthorizeDataShare:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      x-aws-operation-name: DeauthorizeDataShare
      operationId: GET_DeauthorizeDataShare
      description: 'From a datashare producer account, removes authorization from the specified datashare. '
      responses:
        '200':
          description: Success
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/DataShare'
        '480':
          description: InvalidDataShareFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InvalidDataShareFault'
      parameters:
      - name: DataShareArn
        in: query
        required: true
        description: The Amazon Resource Name (ARN) of the datashare to remove authorization from.
        schema:
          type: string
          maxLength: 2147483647
      - name: ConsumerIdentifier
        in: query
        required: true
        description: The identifier of the data consumer that is to have authorization removed from the datashare. This identifier is an Amazon Web Services account ID or a keyword, such as ADX.
        schema:
          type: string
          maxLength: 2147483647
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - DeauthorizeDataShare
      - name: Version
        in: query
        required: true
        schema:
          type: string
          enum:
          - '2012-12-01'
      summary: Amazon Redshift - G E T_ Deauthorize Data Share
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#Action=DeauthorizeDataShare'
    post:
      x-aws-operation-name: DeauthorizeDataShare
      operationId: POST_DeauthorizeDataShare
      description: 'From a datashare producer account, removes authorization from the specified datashare. '
      responses:
        '200':
          description: Success
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/DataShare'
        '480':
          description: InvalidDataShareFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InvalidDataShareFault'
      requestBody:
        content:
          text/xml:
            schema:
              $ref: '#/components/schemas/DeauthorizeDataShareMessage'
      parameters:
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - DeauthorizeDataShare
      - name: Version
        in: query
        required: true
        schema:
          type: string
          enum:
          - '2012-12-01'
      summary: Amazon Redshift - P O S T_ Deauthorize Data Share
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#Action=DeauthorizeDataShare'
components:
  parameters:
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
  schemas:
    Boolean:
      type: boolean
    DataShareStatus:
      type: string
      enum:
      - ACTIVE
      - PENDING_AUTHORIZATION
      - AUTHORIZED
      - DEAUTHORIZED
      - REJECTED
      - AVAILABLE
    DeauthorizeDataShareMessage:
      type: object
      required:
      - DataShareArn
      - ConsumerIdentifier
      title: DeauthorizeDataShareMessage
      properties:
        DataShareArn:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The Amazon Resource Name (ARN) of the datashare to remove authorization from.
        ConsumerIdentifier:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The identifier of the data consumer that is to have authorization removed from the datashare. This identifier is an Amazon Web Services account ID or a keyword, such as ADX.
    TStamp:
      type: string
      format: date-time
    DataShareAssociationList:
      type: array
      items:
        $ref: '#/components/schemas/DataShareAssociation'
    DataShare:
      type: object
      properties:
        DataShareArn:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: An Amazon Resource Name (ARN) that references the datashare that is owned by a specific namespace of the producer cluster. A datashare ARN is in the <code>arn:aws:redshift:{region}:{account-id}:{datashare}:{namespace-guid}/{datashare-name}</code> format.
        ProducerArn:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The Amazon Resource Name (ARN) of the producer.
        AllowPubliclyAccessibleConsumers:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: A value that specifies whether the datashare can be shared to a publicly accessible cluster.
        DataShareAssociations:
          allOf:
          - $ref: '#/components/schemas/DataShareAssociationList'
          - description: A value that specifies when the datashare has an association between producer and data consumers.
        ManagedBy:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The identifier of a datashare to show its managing entity.
    DataShareAssociation:
      type: object
      properties:
        ConsumerIdentifier:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The name of the consumer accounts that have an association with a producer datashare.
        Status:
          allOf:
          - $ref: '#/components/schemas/DataShareStatus'
          - description: The status of the datashare that is associated.
        ConsumerRegion:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The Amazon Web Services Region of the consumer accounts that have an association with a producer datashare.
        CreatedDate:
          allOf:
          - $ref: '#/components/schemas/TStamp'
          - description: The creation date of the datashare that is associated.
        StatusChangeDate:
          allOf:
          - $ref: '#/components/schemas/TStamp'
          - description: The status change data of the datashare that is associated.
      description: 'The association of a datashare from a producer account with a data consumer. '
    InvalidDataShareFault: {}
    String:
      type: string
      maxLength: 2147483647
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/redshift-data/
