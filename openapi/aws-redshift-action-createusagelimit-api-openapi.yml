tags:
- name: '#Action=CreateUsageLimit'
paths:
  /#Action=CreateUsageLimit:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      x-aws-operation-name: CreateUsageLimit
      operationId: GET_CreateUsageLimit
      description: Creates a usage limit for a specified Amazon Redshift feature on a cluster. The usage limit is identified by the returned usage limit identifier.
      responses:
        '200':
          description: Success
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/UsageLimit'
        '480':
          description: ClusterNotFoundFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ClusterNotFoundFault'
        '481':
          description: InvalidClusterStateFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InvalidClusterStateFault'
        '482':
          description: LimitExceededFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/LimitExceededFault'
        '483':
          description: UsageLimitAlreadyExistsFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/UsageLimitAlreadyExistsFault'
        '484':
          description: InvalidUsageLimitFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InvalidUsageLimitFault'
        '485':
          description: TagLimitExceededFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/TagLimitExceededFault'
        '486':
          description: UnsupportedOperationFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/UnsupportedOperationFault'
      parameters:
      - name: ClusterIdentifier
        in: query
        required: true
        description: The identifier of the cluster that you want to limit usage.
        schema:
          type: string
          maxLength: 2147483647
      - name: FeatureType
        in: query
        required: true
        description: The Amazon Redshift feature that you want to limit.
        schema:
          type: string
          enum:
          - spectrum
          - concurrency-scaling
          - cross-region-datasharing
      - name: LimitType
        in: query
        required: true
        description: 'The type of limit. Depending on the feature type, this can be based on a time duration or data size. If <code>FeatureType</code> is <code>spectrum</code>, then <code>LimitType</code> must be <code>data-scanned</code>. If <code>FeatureType</code> is <code>concurrency-scaling</code>, then <code>LimitType</code> must be <code>time</code>. If <code>FeatureType</code> is <code>cross-region-datasharing</code>, then <code>LimitType</code> must be <code>data-scanned</code>. '
        schema:
          type: string
          enum:
          - time
          - data-scanned
      - name: Amount
        in: query
        required: true
        description: 'The limit amount. If time-based, this amount is in minutes. If data-based, this amount is in terabytes (TB). The value must be a positive number. '
        schema:
          type: integer
      - name: Period
        in: query
        required: false
        description: 'The time period that the amount applies to. A <code>weekly</code> period begins on Sunday. The default is <code>monthly</code>. '
        schema:
          type: string
          enum:
          - daily
          - weekly
          - monthly
      - name: BreachAction
        in: query
        required: false
        description: The action that Amazon Redshift takes when the limit is reached. The default is log. For more information about this parameter, see <a>UsageLimit</a>.
        schema:
          type: string
          enum:
          - log
          - emit-metric
          - disable
      - name: Tags
        in: query
        required: false
        description: A list of tag instances.
        schema:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Tag'
            - xml:
                name: Tag
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - CreateUsageLimit
      - name: Version
        in: query
        required: true
        schema:
          type: string
          enum:
          - '2012-12-01'
      summary: Amazon Redshift - G E T_ Create Usage Limit
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#Action=CreateUsageLimit'
    post:
      x-aws-operation-name: CreateUsageLimit
      operationId: POST_CreateUsageLimit
      description: Creates a usage limit for a specified Amazon Redshift feature on a cluster. The usage limit is identified by the returned usage limit identifier.
      responses:
        '200':
          description: Success
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/UsageLimit'
        '480':
          description: ClusterNotFoundFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ClusterNotFoundFault'
        '481':
          description: InvalidClusterStateFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InvalidClusterStateFault'
        '482':
          description: LimitExceededFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/LimitExceededFault'
        '483':
          description: UsageLimitAlreadyExistsFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/UsageLimitAlreadyExistsFault'
        '484':
          description: InvalidUsageLimitFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InvalidUsageLimitFault'
        '485':
          description: TagLimitExceededFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/TagLimitExceededFault'
        '486':
          description: UnsupportedOperationFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/UnsupportedOperationFault'
      requestBody:
        content:
          text/xml:
            schema:
              $ref: '#/components/schemas/CreateUsageLimitMessage'
      parameters:
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - CreateUsageLimit
      - name: Version
        in: query
        required: true
        schema:
          type: string
          enum:
          - '2012-12-01'
      summary: Amazon Redshift - P O S T_ Create Usage Limit
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#Action=CreateUsageLimit'
