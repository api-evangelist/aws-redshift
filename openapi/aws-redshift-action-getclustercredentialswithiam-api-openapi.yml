tags:
- name: '#Action=GetClusterCredentialsWithIAM'
paths:
  /#Action=GetClusterCredentialsWithIAM:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      x-aws-operation-name: GetClusterCredentialsWithIAM
      operationId: GET_GetClusterCredentialsWithIAM
      description: <p>Returns a database user name and temporary password with temporary authorization to log in to an Amazon Redshift database. The database user is mapped 1:1 to the source Identity and Access Management (IAM) identity. For more information about IAM identities, see <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/id.html">IAM Identities (users, user groups, and roles)</a> in the Amazon Web Services Identity and Access Management User Guide.</p> <p>The Identity and Access Management (IAM) identity that runs this operation must have an IAM policy attached that allows access to all necessary actions and resources. For more information about permissions, see <a href="https://docs.aws.amazon.com/redshift/latest/mgmt/redshift-iam-access-control-identity-based.html">Using identity-based policies (IAM policies)</a> in the Amazon Redshift Cluster Management Guide. </p>
      responses:
        '200':
          description: Success
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ClusterExtendedCredentials'
        '480':
          description: ClusterNotFoundFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ClusterNotFoundFault'
        '481':
          description: UnsupportedOperationFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/UnsupportedOperationFault'
      parameters:
      - name: DbName
        in: query
        required: false
        description: The name of the database for which you are requesting credentials. If the database name is specified, the IAM policy must allow access to the resource <code>dbname</code> for the specified database name. If the database name is not specified, access to all databases is allowed.
        schema:
          type: string
          maxLength: 2147483647
      - name: ClusterIdentifier
        in: query
        required: true
        description: 'The unique identifier of the cluster that contains the database for which you are requesting credentials. '
        schema:
          type: string
          maxLength: 2147483647
      - name: DurationSeconds
        in: query
        required: false
        description: '<p>The number of seconds until the returned temporary password expires.</p> <p>Range: 900-3600. Default: 900.</p>'
        schema:
          type: integer
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - GetClusterCredentialsWithIAM
      - name: Version
        in: query
        required: true
        schema:
          type: string
          enum:
          - '2012-12-01'
      summary: Amazon Redshift - G E T_ Get Cluster Credentials with I a M
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#Action=GetClusterCredentialsWithIAM'
    post:
      x-aws-operation-name: GetClusterCredentialsWithIAM
      operationId: POST_GetClusterCredentialsWithIAM
      description: <p>Returns a database user name and temporary password with temporary authorization to log in to an Amazon Redshift database. The database user is mapped 1:1 to the source Identity and Access Management (IAM) identity. For more information about IAM identities, see <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/id.html">IAM Identities (users, user groups, and roles)</a> in the Amazon Web Services Identity and Access Management User Guide.</p> <p>The Identity and Access Management (IAM) identity that runs this operation must have an IAM policy attached that allows access to all necessary actions and resources. For more information about permissions, see <a href="https://docs.aws.amazon.com/redshift/latest/mgmt/redshift-iam-access-control-identity-based.html">Using identity-based policies (IAM policies)</a> in the Amazon Redshift Cluster Management Guide. </p>
      responses:
        '200':
          description: Success
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ClusterExtendedCredentials'
        '480':
          description: ClusterNotFoundFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ClusterNotFoundFault'
        '481':
          description: UnsupportedOperationFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/UnsupportedOperationFault'
      requestBody:
        content:
          text/xml:
            schema:
              $ref: '#/components/schemas/GetClusterCredentialsWithIAMMessage'
      parameters:
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - GetClusterCredentialsWithIAM
      - name: Version
        in: query
        required: true
        schema:
          type: string
          enum:
          - '2012-12-01'
      summary: Amazon Redshift - P O S T_ Get Cluster Credentials with I a M
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#Action=GetClusterCredentialsWithIAM'
components:
  schemas:
    UnsupportedOperationFault: {}
    ClusterExtendedCredentials:
      type: object
      properties:
        DbUser:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: 'A database user name that you provide when you connect to a database. The database user is mapped 1:1 to the source IAM identity. '
        DbPassword:
          allOf:
          - $ref: '#/components/schemas/SensitiveString'
          - description: A temporary password that you provide when you connect to a database.
        Expiration:
          allOf:
          - $ref: '#/components/schemas/TStamp'
          - description: The time (UTC) when the temporary password expires. After this timestamp, a log in with the temporary password fails.
        NextRefreshTime:
          allOf:
          - $ref: '#/components/schemas/TStamp'
          - description: Reserved for future use.
    String:
      type: string
      maxLength: 2147483647
    TStamp:
      type: string
      format: date-time
    GetClusterCredentialsWithIAMMessage:
      type: object
      required:
      - ClusterIdentifier
      title: GetClusterCredentialsWithIAMMessage
      properties:
        DbName:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The name of the database for which you are requesting credentials. If the database name is specified, the IAM policy must allow access to the resource <code>dbname</code> for the specified database name. If the database name is not specified, access to all databases is allowed.
        ClusterIdentifier:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: 'The unique identifier of the cluster that contains the database for which you are requesting credentials. '
        DurationSeconds:
          allOf:
          - $ref: '#/components/schemas/IntegerOptional'
          - description: '<p>The number of seconds until the returned temporary password expires.</p> <p>Range: 900-3600. Default: 900.</p>'
    IntegerOptional:
      type: integer
    SensitiveString:
      type: string
      format: password
    ClusterNotFoundFault: {}
  parameters:
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
