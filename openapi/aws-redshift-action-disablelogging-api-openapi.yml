security:
- hmac: []
tags:
- name: '#Action=DisableLogging'
paths:
  /#Action=DisableLogging:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      x-aws-operation-name: DisableLogging
      operationId: GET_DisableLogging
      description: Stops logging information, such as queries and connection attempts, for the specified Amazon Redshift cluster.
      responses:
        '200':
          description: Success
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/LoggingStatus'
        '480':
          description: ClusterNotFoundFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ClusterNotFoundFault'
        '481':
          description: InvalidClusterStateFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InvalidClusterStateFault'
      parameters:
      - name: ClusterIdentifier
        in: query
        required: true
        description: '<p>The identifier of the cluster on which logging is to be stopped.</p> <p>Example: <code>examplecluster</code> </p>'
        schema:
          type: string
          maxLength: 2147483647
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - DisableLogging
      - name: Version
        in: query
        required: true
        schema:
          type: string
          enum:
          - '2012-12-01'
      summary: Amazon Redshift - G E T_ Disable Logging
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#Action=DisableLogging'
    post:
      x-aws-operation-name: DisableLogging
      operationId: POST_DisableLogging
      description: Stops logging information, such as queries and connection attempts, for the specified Amazon Redshift cluster.
      responses:
        '200':
          description: Success
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/LoggingStatus'
        '480':
          description: ClusterNotFoundFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ClusterNotFoundFault'
        '481':
          description: InvalidClusterStateFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InvalidClusterStateFault'
      requestBody:
        content:
          text/xml:
            schema:
              $ref: '#/components/schemas/DisableLoggingMessage'
      parameters:
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - DisableLogging
      - name: Version
        in: query
        required: true
        schema:
          type: string
          enum:
          - '2012-12-01'
      summary: Amazon Redshift - P O S T_ Disable Logging
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#Action=DisableLogging'
components:
  schemas:
    LogTypeList:
      type: array
      items:
        $ref: '#/components/schemas/String'
    Boolean:
      type: boolean
    TStamp:
      type: string
      format: date-time
    LogDestinationType:
      type: string
      enum:
      - s3
      - cloudwatch
    InvalidClusterStateFault: {}
    DisableLoggingMessage:
      type: object
      required:
      - ClusterIdentifier
      title: DisableLoggingMessage
      properties:
        ClusterIdentifier:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: '<p>The identifier of the cluster on which logging is to be stopped.</p> <p>Example: <code>examplecluster</code> </p>'
      description: <p/>
    ClusterNotFoundFault: {}
    LoggingStatus:
      type: object
      properties:
        LoggingEnabled:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: ' <code>true</code> if logging is on, <code>false</code> if logging is off.'
        BucketName:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The name of the S3 bucket where the log files are stored.
        S3KeyPrefix:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The prefix applied to the log file names.
        LastSuccessfulDeliveryTime:
          allOf:
          - $ref: '#/components/schemas/TStamp'
          - description: The last time that logs were delivered.
        LastFailureTime:
          allOf:
          - $ref: '#/components/schemas/TStamp'
          - description: The last time when logs failed to be delivered.
        LastFailureMessage:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The message indicating that logs failed to be delivered.
        LogDestinationType:
          allOf:
          - $ref: '#/components/schemas/LogDestinationType'
          - description: The log destination type. An enum with possible values of <code>s3</code> and <code>cloudwatch</code>.
        LogExports:
          allOf:
          - $ref: '#/components/schemas/LogTypeList'
          - description: The collection of exported log types. Possible values are <code>connectionlog</code>, <code>useractivitylog</code>, and <code>userlog</code>.
      description: Describes the status of logging for a cluster.
    String:
      type: string
      maxLength: 2147483647
  parameters:
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
