tags:
- name: '#Action=RestoreTableFromClusterSnapshot'
paths:
  /#Action=RestoreTableFromClusterSnapshot:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      x-aws-operation-name: RestoreTableFromClusterSnapshot
      operationId: GET_RestoreTableFromClusterSnapshot
      description: <p>Creates a new table from a table in an Amazon Redshift cluster snapshot. You must create the new table within the Amazon Redshift cluster that the snapshot was taken from.</p> <p>You cannot use <code>RestoreTableFromClusterSnapshot</code> to restore a table with the same name as an existing table in an Amazon Redshift cluster. That is, you cannot overwrite an existing table in a cluster with a restored table. If you want to replace your original table with a new, restored table, then rename or drop your original table before you call <code>RestoreTableFromClusterSnapshot</code>. When you have renamed your original table, then you can pass the original name of the table as the <code>NewTableName</code> parameter value in the call to <code>RestoreTableFromClusterSnapshot</code>. This way, you can replace the original table with the table created from the snapshot.</p> <p>You can't use this operation to restore tables with <a href="https://docs.aws.amazon.com/redshift/latest/dg/t_Sorting_data.html#t_Sorting_data-interleaved">interleaved sort keys</a>.</p>
      responses:
        '200':
          description: Success
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/RestoreTableFromClusterSnapshotResult'
        '480':
          description: ClusterSnapshotNotFoundFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ClusterSnapshotNotFoundFault'
        '481':
          description: InProgressTableRestoreQuotaExceededFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InProgressTableRestoreQuotaExceededFault'
        '482':
          description: InvalidClusterSnapshotStateFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InvalidClusterSnapshotStateFault'
        '483':
          description: InvalidTableRestoreArgumentFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InvalidTableRestoreArgumentFault'
        '484':
          description: ClusterNotFoundFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ClusterNotFoundFault'
        '485':
          description: InvalidClusterStateFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InvalidClusterStateFault'
        '486':
          description: UnsupportedOperationFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/UnsupportedOperationFault'
      parameters:
      - name: ClusterIdentifier
        in: query
        required: true
        description: The identifier of the Amazon Redshift cluster to restore the table to.
        schema:
          type: string
          maxLength: 2147483647
      - name: SnapshotIdentifier
        in: query
        required: true
        description: The identifier of the snapshot to restore the table from. This snapshot must have been created from the Amazon Redshift cluster specified by the <code>ClusterIdentifier</code> parameter.
        schema:
          type: string
          maxLength: 2147483647
      - name: SourceDatabaseName
        in: query
        required: true
        description: The name of the source database that contains the table to restore from.
        schema:
          type: string
          maxLength: 2147483647
      - name: SourceSchemaName
        in: query
        required: false
        description: The name of the source schema that contains the table to restore from. If you do not specify a <code>SourceSchemaName</code> value, the default is <code>public</code>.
        schema:
          type: string
          maxLength: 2147483647
      - name: SourceTableName
        in: query
        required: true
        description: The name of the source table to restore from.
        schema:
          type: string
          maxLength: 2147483647
      - name: TargetDatabaseName
        in: query
        required: false
        description: The name of the database to restore the table to.
        schema:
          type: string
          maxLength: 2147483647
      - name: TargetSchemaName
        in: query
        required: false
        description: The name of the schema to restore the table to.
        schema:
          type: string
          maxLength: 2147483647
      - name: NewTableName
        in: query
        required: true
        description: The name of the table to create as a result of the current request.
        schema:
          type: string
          maxLength: 2147483647
      - name: EnableCaseSensitiveIdentifier
        in: query
        required: false
        description: Indicates whether name identifiers for database, schema, and table are case sensitive. If <code>true</code>, the names are case sensitive. If <code>false</code> (default), the names are not case sensitive.
        schema:
          type: boolean
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - RestoreTableFromClusterSnapshot
      - name: Version
        in: query
        required: true
        schema:
          type: string
          enum:
          - '2012-12-01'
      summary: Amazon Redshift - G E T_ Restore Table from Cluster Snapshot
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#Action=RestoreTableFromClusterSnapshot'
    post:
      x-aws-operation-name: RestoreTableFromClusterSnapshot
      operationId: POST_RestoreTableFromClusterSnapshot
      description: <p>Creates a new table from a table in an Amazon Redshift cluster snapshot. You must create the new table within the Amazon Redshift cluster that the snapshot was taken from.</p> <p>You cannot use <code>RestoreTableFromClusterSnapshot</code> to restore a table with the same name as an existing table in an Amazon Redshift cluster. That is, you cannot overwrite an existing table in a cluster with a restored table. If you want to replace your original table with a new, restored table, then rename or drop your original table before you call <code>RestoreTableFromClusterSnapshot</code>. When you have renamed your original table, then you can pass the original name of the table as the <code>NewTableName</code> parameter value in the call to <code>RestoreTableFromClusterSnapshot</code>. This way, you can replace the original table with the table created from the snapshot.</p> <p>You can't use this operation to restore tables with <a href="https://docs.aws.amazon.com/redshift/latest/dg/t_Sorting_data.html#t_Sorting_data-interleaved">interleaved sort keys</a>.</p>
      responses:
        '200':
          description: Success
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/RestoreTableFromClusterSnapshotResult'
        '480':
          description: ClusterSnapshotNotFoundFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ClusterSnapshotNotFoundFault'
        '481':
          description: InProgressTableRestoreQuotaExceededFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InProgressTableRestoreQuotaExceededFault'
        '482':
          description: InvalidClusterSnapshotStateFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InvalidClusterSnapshotStateFault'
        '483':
          description: InvalidTableRestoreArgumentFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InvalidTableRestoreArgumentFault'
        '484':
          description: ClusterNotFoundFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ClusterNotFoundFault'
        '485':
          description: InvalidClusterStateFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InvalidClusterStateFault'
        '486':
          description: UnsupportedOperationFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/UnsupportedOperationFault'
      requestBody:
        content:
          text/xml:
            schema:
              $ref: '#/components/schemas/RestoreTableFromClusterSnapshotMessage'
      parameters:
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - RestoreTableFromClusterSnapshot
      - name: Version
        in: query
        required: true
        schema:
          type: string
          enum:
          - '2012-12-01'
      summary: Amazon Redshift - P O S T_ Restore Table from Cluster Snapshot
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#Action=RestoreTableFromClusterSnapshot'
