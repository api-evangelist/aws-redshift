tags:
- name: '#Action=AuthorizeEndpointAccess'
paths:
  /#Action=AuthorizeEndpointAccess:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      x-aws-operation-name: AuthorizeEndpointAccess
      operationId: GET_AuthorizeEndpointAccess
      description: Grants access to a cluster.
      responses:
        '200':
          description: Success
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/EndpointAuthorization'
        '480':
          description: ClusterNotFoundFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ClusterNotFoundFault'
        '481':
          description: EndpointAuthorizationsPerClusterLimitExceededFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/EndpointAuthorizationsPerClusterLimitExceededFault'
        '482':
          description: UnsupportedOperationFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/UnsupportedOperationFault'
        '483':
          description: EndpointAuthorizationAlreadyExistsFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/EndpointAuthorizationAlreadyExistsFault'
        '484':
          description: InvalidAuthorizationStateFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InvalidAuthorizationStateFault'
        '485':
          description: InvalidClusterStateFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InvalidClusterStateFault'
      parameters:
      - name: ClusterIdentifier
        in: query
        required: false
        description: The cluster identifier of the cluster to grant access to.
        schema:
          type: string
          maxLength: 2147483647
      - name: Account
        in: query
        required: true
        description: The Amazon Web Services account ID to grant access to.
        schema:
          type: string
          maxLength: 2147483647
      - name: VpcIds
        in: query
        required: false
        description: The virtual private cloud (VPC) identifiers to grant access to.
        schema:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/String'
            - xml:
                name: VpcIdentifier
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - AuthorizeEndpointAccess
      - name: Version
        in: query
        required: true
        schema:
          type: string
          enum:
          - '2012-12-01'
      summary: Amazon Redshift - G E T_ Authorize Endpoint Access
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#Action=AuthorizeEndpointAccess'
    post:
      x-aws-operation-name: AuthorizeEndpointAccess
      operationId: POST_AuthorizeEndpointAccess
      description: Grants access to a cluster.
      responses:
        '200':
          description: Success
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/EndpointAuthorization'
        '480':
          description: ClusterNotFoundFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ClusterNotFoundFault'
        '481':
          description: EndpointAuthorizationsPerClusterLimitExceededFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/EndpointAuthorizationsPerClusterLimitExceededFault'
        '482':
          description: UnsupportedOperationFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/UnsupportedOperationFault'
        '483':
          description: EndpointAuthorizationAlreadyExistsFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/EndpointAuthorizationAlreadyExistsFault'
        '484':
          description: InvalidAuthorizationStateFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InvalidAuthorizationStateFault'
        '485':
          description: InvalidClusterStateFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/InvalidClusterStateFault'
      requestBody:
        content:
          text/xml:
            schema:
              $ref: '#/components/schemas/AuthorizeEndpointAccessMessage'
      parameters:
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - AuthorizeEndpointAccess
      - name: Version
        in: query
        required: true
        schema:
          type: string
          enum:
          - '2012-12-01'
      summary: Amazon Redshift - P O S T_ Authorize Endpoint Access
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#Action=AuthorizeEndpointAccess'
components:
  schemas:
    Integer:
      type: integer
    EndpointAuthorization:
      type: object
      properties:
        Grantor:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The Amazon Web Services account ID of the cluster owner.
        Grantee:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The Amazon Web Services account ID of the grantee of the cluster.
        ClusterIdentifier:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The cluster identifier.
        AuthorizeTime:
          allOf:
          - $ref: '#/components/schemas/TStamp'
          - description: The time (UTC) when the authorization was created.
        ClusterStatus:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The status of the cluster.
        Status:
          allOf:
          - $ref: '#/components/schemas/AuthorizationStatus'
          - description: The status of the authorization action.
        AllowedAllVPCs:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: Indicates whether all VPCs in the grantee account are allowed access to the cluster.
        AllowedVPCs:
          allOf:
          - $ref: '#/components/schemas/VpcIdentifierList'
          - description: The VPCs allowed access to the cluster.
        EndpointCount:
          allOf:
          - $ref: '#/components/schemas/Integer'
          - description: The number of Redshift-managed VPC endpoints created for the authorization.
      description: Describes an endpoint authorization for authorizing Redshift-managed VPC endpoint access to a cluster across Amazon Web Services accounts.
    TStamp:
      type: string
      format: date-time
    EndpointAuthorizationsPerClusterLimitExceededFault: {}
    AuthorizationStatus:
      type: string
      enum:
      - Authorized
      - Revoking
    InvalidAuthorizationStateFault: {}
    UnsupportedOperationFault: {}
    VpcIdentifierList:
      type: array
      items:
        allOf:
        - $ref: '#/components/schemas/String'
        - xml:
            name: VpcIdentifier
    Boolean:
      type: boolean
    String:
      type: string
      maxLength: 2147483647
    AuthorizeEndpointAccessMessage:
      type: object
      required:
      - Account
      title: AuthorizeEndpointAccessMessage
      properties:
        ClusterIdentifier:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The cluster identifier of the cluster to grant access to.
        Account:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The Amazon Web Services account ID to grant access to.
        VpcIds:
          allOf:
          - $ref: '#/components/schemas/VpcIdentifierList'
          - description: The virtual private cloud (VPC) identifiers to grant access to.
    EndpointAuthorizationAlreadyExistsFault: {}
    InvalidClusterStateFault: {}
    ClusterNotFoundFault: {}
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
