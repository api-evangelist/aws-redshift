vocabulary:
  title: Amazon Redshift Vocabulary
  description: Controlled vocabulary for Amazon Redshift data warehouse and SQL execution concepts
  created: "2026-04-19"
  modified: "2026-04-19"
  terms:
    - term: Cluster
      definition: A set of nodes which consists of a leader node and one or more compute nodes that run the Amazon Redshift database.
      tags:
        - Infrastructure
        - Core
    - term: Snapshot
      definition: A point-in-time backup of a Redshift cluster stored in Amazon S3.
      tags:
        - Backup
        - Storage
    - term: Node
      definition: A compute unit in a Redshift cluster. Node types determine CPU, RAM, and storage capacity.
      tags:
        - Infrastructure
    - term: SQL Statement
      definition: A SQL command submitted via the Redshift Data API for execution without direct connection management.
      tags:
        - Data API
        - SQL
    - term: Workgroup
      definition: A collection of resources for Redshift Serverless that processes queries.
      tags:
        - Serverless
    - term: Namespace
      definition: A collection of database objects and users in Redshift Serverless.
      tags:
        - Serverless
    - term: Reserved Node
      definition: A pre-purchased Redshift node with discounted pricing compared to on-demand rates.
      tags:
        - Billing
    - term: Resize
      definition: The operation to change the number or type of nodes in a cluster.
      tags:
        - Operations
        - Scaling
    - term: Maintenance Window
      definition: A weekly time window during which system maintenance can occur on the cluster.
      tags:
        - Operations
    - term: Parameter Group
      definition: A group of parameters that apply to all databases created in a cluster.
      tags:
        - Configuration
    - term: Subnet Group
      definition: A collection of subnets designated for your Amazon Redshift cluster.
      tags:
        - Networking
