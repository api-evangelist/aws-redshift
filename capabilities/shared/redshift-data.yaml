naftiko: "1.0.0-alpha1"
info:
  label: Amazon Redshift Data API
  description: Shared capability definitions for the Amazon Redshift Data API providing SQL execution without connection management.
  tags:
    - Data Access
    - Serverless
    - SQL
  created: "2026-04-19"
  modified: "2026-04-19"
capability:
  exposes:
    - type: rest
      port: 8101
      namespace: redshift-data-api
      resources:
        - label: Execute Statement
          method: POST
          path: /
          operationId: ExecuteStatement
        - label: Batch Execute Statement
          method: POST
          path: /
          operationId: BatchExecuteStatement
        - label: Describe Statement
          method: POST
          path: /
          operationId: DescribeStatement
        - label: Get Statement Result
          method: POST
          path: /
          operationId: GetStatementResult
        - label: List Statements
          method: POST
          path: /
          operationId: ListStatements
        - label: Cancel Statement
          method: POST
          path: /
          operationId: CancelStatement
