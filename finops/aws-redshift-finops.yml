description: 'FOCUS-aligned FinOps for Amazon Redshift: dual-shape billing — Serverless RPU-hour vs
  Provisioned per-node-hour — plus separately metered Redshift Managed Storage, Spectrum scans,
  concurrency scaling, and cross-region transfer. Reserved Instances and Serverless commitments
  provide committed-use discounts.'
