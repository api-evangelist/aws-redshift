meters:
  - name: serverless_rpu_hours
    unit: RPU-hour
    aggregation: sum
    dimensions:
      - region
      - workgroup
      - namespace
  - name: provisioned_node_hours
    unit: hour
    aggregation: sum
    dimensions:
      - region
      - cluster_identifier
      - node_type
      - billing_mode
  - name: managed_storage
    unit: GB-month
    aggregation: max
    dimensions:
      - region
      - cluster_or_namespace
  - name: concurrency_scaling_seconds
    unit: second
    aggregation: sum
    dimensions:
      - region
      - cluster_identifier
  - name: spectrum_scanned
    unit: TB
    aggregation: sum
    dimensions:
      - region
      - schema
  - name: backup_storage
    unit: GB-month
    aggregation: max
    dimensions:
      - region
      - cluster_identifier
  - name: cross_region_transfer
    unit: GB
    aggregation: sum
    dimensions:
      - source_region
      - destination_region
  - name: reserved_node_commitment
    unit: node-month
    aggregation: sum
principles:
  - name: Visibility
    description: Use SVL_ / STL_ system tables (e.g. SVL_QUERY_REPORT, STL_USAGE_CONTROL) for
      per-query/per-user spend signal; in CUR / Cost Explorer split by UsageType (NodeUsage,
      ServerlessUsage:RPUUsage, RMS:StorageUsage, ConcurrencyScaling:NodeUsage, RedshiftSpectrum). The
      Redshift console also shows Serverless RPU consumption and concurrency-scaling credits.
  - name: Allocation
    description: Tag clusters and Serverless namespaces with team / product cost-allocation tags. For
      shared clusters, attribute via database / schema ownership and per-user query-cost reports.
  - name: Optimization
    description: 'Major levers: (1) right-size — RA3 + RMS so storage scales independently of compute;
      (2) buy Reserved Instances for steady-state provisioned clusters (up to ~75% savings); (3) use
      Concurrency Scaling rather than oversize the base cluster; (4) WLM tuning to keep ETL out of the
      interactive queue; (5) Spectrum / data lake offload for rarely scanned cold data; (6) for
      Serverless, tune base RPU floor and use query monitoring to cap runaway scans.'
  - name: Accountability
    description: Data platform team owns Redshift estate and reservation strategy; consuming teams are
      accountable for query efficiency, predicate pushdown, and table design (sort/dist keys).
